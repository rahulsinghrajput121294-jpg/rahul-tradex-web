<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rahul TradeX · Live Charts</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#131722;color:#d1d4dc;font:13px -apple-system,Segoe UI,Roboto,sans-serif}
button,input{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto auto 1fr;height:100%}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:8px 12px;border-bottom:1px solid #2a2e39;background:#1b1f2b}
.brand{font-weight:700;font-size:16px;color:#fff;white-space:nowrap}
.brand span{color:#26a69a}
#search{background:#131722;border:1px solid #2a2e39;border-radius:6px;padding:6px 10px;width:150px;text-transform:uppercase}
.grp{display:flex;gap:2px;flex-wrap:wrap}
.btn{background:none;border:0;padding:5px 9px;border-radius:5px;cursor:pointer;color:#a3acbf}
.btn:hover{background:#2a2e39}
.btn.on{background:#2962ff33;color:#6ea1ff}
#status{margin-left:auto;font-size:12px;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#ef5350}
.dot.open{background:#26a69a}
#bar{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;padding:8px 14px;border-bottom:1px solid #2a2e39}
#sym{font-size:20px;font-weight:700;color:#fff}
#price{font-size:24px;font-weight:700}
#chg{font-size:14px}
.up{color:#26a69a}.down{color:#ef5350}
#err{display:none;background:#5a2327;color:#ffb4b4;padding:6px 14px;font-size:12px}
main{display:grid;grid-template-columns:1fr 280px;min-height:0}
#charts{display:flex;flex-direction:column;min-height:0;position:relative}
#legend{position:absolute;left:10px;top:6px;z-index:5;font-size:12px;pointer-events:none}
.pane{position:relative;min-height:0}
#main{flex:1}
#rsi{height:120px;border-top:1px solid #2a2e39}
#macd{height:140px;border-top:1px solid #2a2e39}
.tag{position:absolute;left:10px;top:4px;z-index:5;font-size:11px;color:#8a93a6;pointer-events:none}
aside{border-left:1px solid #2a2e39;overflow:auto;background:#161a25}
aside h3{margin:0;padding:10px 12px;font-size:12px;letter-spacing:.06em;color:#8a93a6;position:sticky;top:0;background:#161a25}
.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:7px 12px;cursor:pointer;border-bottom:1px solid #1e222d}
.row:hover{background:#1e222d}
.row.on{background:#2962ff22}
.row .n{font-weight:600}
.row .p,.row .c{text-align:right;font-variant-numeric:tabular-nums}
.row .c{min-width:62px}
footer{padding:4px 12px;font-size:11px;color:#6b7387;border-top:1px solid #2a2e39}
@media(max-width:820px){
  #app{height:auto;min-height:100%}
  main{grid-template-columns:1fr;grid-template-rows:60vh 320px}
  aside{border-left:0;border-top:1px solid #2a2e39}
  #status{margin-left:0}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Rahul <span>TradeX</span></div>
    <input id="search" list="symlist" placeholder="Symbol e.g. TCS" autocomplete="off">
    <datalist id="symlist"></datalist>
    <div class="grp" id="tfs"></div>
    <div class="grp" id="inds"></div>
    <div id="status"></div>
  </header>
  <div>
    <div id="bar"><span id="sym">–</span><span id="price">–</span><span id="chg"></span></div>
    <div id="err"></div>
  </div>
  <main>
    <section id="charts">
      <div id="legend"></div>
      <div id="main" class="pane"></div>
      <div id="rsi" class="pane"><div class="tag">RSI 14</div></div>
      <div id="macd" class="pane"><div class="tag">MACD 12 26 9</div></div>
    </section>
    <aside><h3>WATCHLIST</h3><div id="wl"></div></aside>
  </main>
  <footer>Data: Yahoo Finance via NSE, can lag a few minutes. For information only, not investment advice.</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const $ = s => document.querySelector(s);
const TFS = ['1m', '5m', '15m', '1H', '1D', '1W'];
const INDS = ['EMA 9', 'EMA 21', 'SMA 50', 'SMA 200', 'BB', 'VWAP', 'RSI', 'MACD'];
const OVER = {'EMA 9': ['ema', 9, '#f5a623'], 'EMA 21': ['ema', 21, '#4da3ff'], 'SMA 50': ['sma', 50, '#b388ff'], 'SMA 200': ['sma', 200, '#ff6f91']};
const S = {symbol: 'RELIANCE', tf: '5m', ind: new Set(['EMA 9', 'EMA 21', 'RSI']), data: null, first: true, series: [], timer: null};

// ---------- indicator maths ----------
const ema = (v, n) => { const k = 2 / (n + 1); let e; return v.map((x, i) => e = i ? x * k + e * (1 - k) : x); };
const sma = (v, n) => v.map((_, i) => i < n - 1 ? null : v.slice(i - n + 1, i + 1).reduce((a, b) => a + b, 0) / n);
function bb(v, n = 20) {
  const m = sma(v, n);
  const sd = v.map((_, i) => { if (i < n - 1) return null; const w = v.slice(i - n + 1, i + 1); return Math.sqrt(w.reduce((a, x) => a + (x - m[i]) ** 2, 0) / n); });
  return [m, m.map((x, i) => x === null ? null : x + 2 * sd[i]), m.map((x, i) => x === null ? null : x - 2 * sd[i])];
}
function rsi(v, n = 14) {
  let g = 0, l = 0;
  return v.map((x, i) => {
    if (!i) return null;
    const d = x - v[i - 1], up = Math.max(d, 0), dn = Math.max(-d, 0);
    if (i <= n) { g += up / n; l += dn / n; return i === n ? (l === 0 ? 100 : 100 - 100 / (1 + g / l)) : null; }
    g = (g * (n - 1) + up) / n; l = (l * (n - 1) + dn) / n;
    return l === 0 ? 100 : 100 - 100 / (1 + g / l);
  });
}
function vwap(c) {
  let pv = 0, vv = 0, day = null;
  return c.map(b => { const d = Math.floor(b.time / 86400); if (d !== day) { day = d; pv = vv = 0; } pv += (b.high + b.low + b.close) / 3 * b.volume; vv += b.volume; return vv ? pv / vv : null; });
}
const pts = (c, vals) => c.map((b, i) => vals[i] == null ? null : {time: b.time, value: vals[i]}).filter(Boolean);

// ---------- charts ----------
const base = {layout: {background: {color: '#131722'}, textColor: '#d1d4dc'}, grid: {vertLines: {color: '#1e222d'}, horzLines: {color: '#1e222d'}}, rightPriceScale: {borderColor: '#2a2e39'}, timeScale: {borderColor: '#2a2e39', rightOffset: 6}, crosshair: {mode: 0}};
const mk = id => { const el = $('#' + id); return LightweightCharts.createChart(el, {...base, width: el.clientWidth, height: el.clientHeight}); };
const cMain = mk('main'), cRsi = mk('rsi'), cMacd = mk('macd');
const charts = [cMain, cRsi, cMacd];
const candle = cMain.addCandlestickSeries({upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350'});
const vol = cMain.addHistogramSeries({priceFormat: {type: 'volume'}, priceScaleId: 'vol'});
cMain.priceScale('vol').applyOptions({scaleMargins: {top: 0.85, bottom: 0}});
const rsiS = cRsi.addLineSeries({color: '#b388ff', lineWidth: 1, priceLineVisible: false});
[70, 30].forEach(p => rsiS.createPriceLine({price: p, color: '#5c6b8a', lineWidth: 1, lineStyle: 2, axisLabelVisible: false}));
const mHist = cMacd.addHistogramSeries({priceLineVisible: false, lastValueVisible: false});
const mLine = cMacd.addLineSeries({color: '#4da3ff', lineWidth: 1, priceLineVisible: false, lastValueVisible: false});
const mSig = cMacd.addLineSeries({color: '#f5a623', lineWidth: 1, priceLineVisible: false, lastValueVisible: false});

let syncing = false;
charts.forEach(src => src.timeScale().subscribeVisibleLogicalRangeChange(r => {
  if (syncing || !r) return; syncing = true;
  charts.forEach(c => c !== src && c.timeScale().setVisibleLogicalRange(r)); syncing = false;
}));
function resize() { charts.forEach((c, i) => { const el = $(['#main', '#rsi', '#macd'][i]); c.applyOptions({width: el.clientWidth, height: el.clientHeight}); }); }
new ResizeObserver(resize).observe($('#charts'));
window.addEventListener('resize', resize);

const fmt = n => n == null ? '–' : n.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
function legend(b) {
  if (!b) return;
  const col = b.close >= b.open ? 'up' : 'down', ch = b.close - b.open;
  $('#legend').innerHTML = `<span class="${col}">O ${fmt(b.open)} &nbsp;H ${fmt(b.high)} &nbsp;L ${fmt(b.low)} &nbsp;C ${fmt(b.close)} &nbsp;${ch >= 0 ? '+' : ''}${fmt(ch)} (${(ch / b.open * 100).toFixed(2)}%)</span>`;
}
cMain.subscribeCrosshairMove(p => { const b = p.seriesData && p.seriesData.get(candle); legend(b || (S.data && S.data.candles.at(-1))); });

function draw() {
  const d = S.data; if (!d) return;
  const c = d.candles, close = c.map(b => b.close);
  candle.setData(c);
  vol.setData(c.map(b => ({time: b.time, value: b.volume, color: b.close >= b.open ? '#26a69a55' : '#ef535055'})));
  S.series.forEach(s => cMain.removeSeries(s)); S.series = [];
  const line = (vals, color) => { const s = cMain.addLineSeries({color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false}); s.setData(pts(c, vals)); S.series.push(s); };
  S.ind.forEach(n => {
    if (OVER[n]) { const [k, len, col] = OVER[n]; line((k === 'ema' ? ema(close, len).map((x, i) => i < len - 1 ? null : x) : sma(close, len)), col); }
    if (n === 'BB') bb(close).forEach((v, i) => line(v, i ? '#5c6b8a' : '#7a8599'));
    if (n === 'VWAP' && d.intraday) line(vwap(c), '#00d1b2');
  });
  const showR = S.ind.has('RSI'), showM = S.ind.has('MACD');
  $('#rsi').style.display = showR ? '' : 'none'; $('#macd').style.display = showM ? '' : 'none';
  resize();
  if (showR) rsiS.setData(pts(c, rsi(close)));
  if (showM) {
    const e26 = ema(close, 26), m = ema(close, 12).map((x, i) => x - e26[i]), sg = ema(m, 9);
    mLine.setData(pts(c, m)); mSig.setData(pts(c, sg));
    mHist.setData(c.map((b, i) => ({time: b.time, value: m[i] - sg[i], color: m[i] - sg[i] >= 0 ? '#26a69aaa' : '#ef5350aa'})));
  }
  const ts = {timeVisible: d.intraday, secondsVisible: false};
  charts.forEach(ch => ch.applyOptions({timeScale: ts}));
  if (S.first) { cMain.timeScale().setVisibleLogicalRange({from: Math.max(0, c.length - 120), to: c.length + 6}); S.first = false; }
  legend(c.at(-1));
}

// ---------- data ----------
async function api(path) { const r = await fetch(path); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status); return r.json(); }
function err(msg) { const e = $('#err'); e.style.display = msg ? 'block' : 'none'; e.textContent = msg || ''; }

async function loadCandles() {
  try { S.data = await api(`/api/candles?symbol=${encodeURIComponent(S.symbol)}&tf=${S.tf}`); err(''); draw(); }
  catch (e) { err(`No live data for ${S.symbol} right now (${e.message}). Retrying automatically.`); }
}
async function loadQuote() {
  try {
    const q = await api(`/api/quote?symbol=${encodeURIComponent(S.symbol)}`);
    $('#sym').textContent = q.symbol; $('#price').textContent = '₹' + fmt(q.price);
    const c = $('#chg'); if (q.change != null) { c.textContent = `${q.change >= 0 ? '+' : ''}${fmt(q.change)} (${q.change_pct >= 0 ? '+' : ''}${q.change_pct.toFixed(2)}%)`; c.className = q.change >= 0 ? 'up' : 'down'; } else c.textContent = '';
    $('#status').innerHTML = `<span class="dot ${q.market_open ? 'open' : ''}"></span>${q.market_open ? 'Market open' : 'Market closed, last price'} · ${new Date(q.fetched_at).toLocaleTimeString('en-IN', {timeZone: 'Asia/Kolkata'})} IST`;
    document.title = `${fmt(q.price)} ${q.symbol} · Rahul TradeX`;
    S.open = q.market_open;
  } catch (e) { $('#price').textContent = '–'; $('#chg').textContent = ''; }
}
async function loadWatch() {
  try {
    const w = await api('/api/watchlist');
    $('#wl').innerHTML = w.map(r => `<div class="row ${r.symbol === S.symbol ? 'on' : ''}" data-s="${r.symbol}"><span class="n">${r.symbol}</span><span class="p">${fmt(r.last)}</span><span class="c ${r.pct == null ? '' : r.pct >= 0 ? 'up' : 'down'}">${r.pct == null ? '–' : (r.pct >= 0 ? '+' : '') + r.pct.toFixed(2) + '%'}</span></div>`).join('');
  } catch (e) { /* keep old list */ }
}
function setSymbol(sym, tf) {
  S.symbol = sym.toUpperCase().replace(/^NSE:/, ''); if (tf) S.tf = tf; S.first = true; S.data = null;
  location.hash = `${S.symbol}/${S.tf}`; $('#search').value = '';
  document.querySelectorAll('.row').forEach(r => r.classList.toggle('on', r.dataset.s === S.symbol));
  document.querySelectorAll('#tfs .btn').forEach(b => b.classList.toggle('on', b.textContent === S.tf));
  loadCandles(); loadQuote(); schedule();
}
function schedule() { clearInterval(S.timer); S.timer = setInterval(() => { loadQuote(); loadCandles(); }, S.open === false ? 60000 : 10000); }

// ---------- UI wiring ----------
$('#tfs').innerHTML = TFS.map(t => `<button class="btn ${t === S.tf ? 'on' : ''}">${t}</button>`).join('');
$('#inds').innerHTML = INDS.map(t => `<button class="btn ${S.ind.has(t) ? 'on' : ''}">${t}</button>`).join('');
$('#tfs').onclick = e => e.target.classList.contains('btn') && setSymbol(S.symbol, e.target.textContent);
$('#inds').onclick = e => { if (!e.target.classList.contains('btn')) return; const n = e.target.textContent; S.ind.has(n) ? S.ind.delete(n) : S.ind.add(n); e.target.classList.toggle('on'); draw(); };
$('#wl').onclick = e => { const r = e.target.closest('.row'); if (r) setSymbol(r.dataset.s); };
$('#search').onkeydown = e => { if (e.key === 'Enter' && e.target.value.trim()) setSymbol(e.target.value.trim()); };
api('/api/symbols').then(l => $('#symlist').innerHTML = l.map(s => `<option value="${s}">`).join('')).catch(() => {});

const [hs, ht] = location.hash.slice(1).split('/');
if (ht && TFS.includes(ht)) S.tf = ht;
if (hs) S.symbol = decodeURIComponent(hs).toUpperCase();
setSymbol(S.symbol, S.tf); loadWatch(); setInterval(loadWatch, 60000);

</script>
</body>
</html>
